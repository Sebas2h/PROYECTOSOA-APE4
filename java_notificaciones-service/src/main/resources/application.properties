spring.application.name=notificaciones-service
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1
app.notificacion-key=${NOTIFICACIONES_KEY}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${NOTIFICACIONES_DB:notificaciones_service}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.rabbit.exchange=${RABBITMQ_EXCHANGE:ventas.events}
app.rabbit.queue=${RABBITMQ_QUEUE:notificaciones.ventas}
app.rabbit.routing-key=${RABBITMQ_ROUTING_KEY:venta.completada}
management.endpoints.web.exposure.include=health,info
