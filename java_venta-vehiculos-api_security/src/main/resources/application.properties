# API de vehículos: solamente el equipo local.
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

# MySQL/MariaDB ya existente en XAMPP (NO crear otra base).
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${VEHICULOS_DB:venta_vehiculos}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Verificar la estructura, sin crear ni modificar tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Autenticación JWT y cliente. VALORES DIDÁCTICOS: cambiar fuera del laboratorio.
app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-minutes=30
app.security.refresh-token-minutes=1440
app.security.client-id=${OAUTH_CLIENT_ID:vehiculos-client}
app.security.client-secret=${OAUTH_CLIENT_SECRET}

# DEBE coincidir con SERVICE_KEY en Python (longitud >= 32).
app.security.ventas-key=${VENTAS_SERVICE_KEY}

# Notificaciones Java: comparte la MISMA clave con Python.
servicios.notificaciones.url=${NOTIFICACIONES_URL:http://127.0.0.1:8090}
servicios.notificaciones.key=${NOTIFICACIONES_KEY}
servicios.notificaciones.destinatario=pruebas@ejemplo.com

# SOLO si necesitas crear un usuario de prueba: activar temporalmente
# spring.profiles.active=local
app.bootstrap.user=${BOOTSTRAP_USER:admin-local}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.bootstrap.role=${BOOTSTRAP_ROLE:ADMIN}
management.endpoints.web.exposure.include=health,info
